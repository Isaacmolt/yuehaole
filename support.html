<h1>美約 支援</h1>
<p>美約是給美甲、美睫、紋繡、美髮、採耳、按摩、寵物美容等一人工作室的預約簿。一次買斷、沒有月費、資料只在你的手機。</p>
<h2>常見問題</h2>
<p><b>換手機資料會不見嗎？</b> 不會。到「設定 → 匯出備份」把檔案存到 iCloud 雲碟或傳給自己，新手機安裝後「匯入備份」即可。</p>
<p><b>買了之後換手機要再買嗎？</b> 不用。同一個 Apple ID 在新手機點「恢復購買」就會解鎖。</p>
<p><b>可以多人共用嗎？</b> 目前為單機版，一支手機一本預約簿。</p>
<h2>聯絡</h2>
<p>意見與問題請來信 <a href="mailto:hd@lab-tw.com">hd@lab-tw.com</a>，或直接在 App「設定 → 意見回饋」寄信。</p>
